name: Build Android APK

# GitHub 클라우드 러너에서 APK를 빌드한다.
# 러너에는 Android SDK가 미리 설치돼 있고 인터넷이 열려 있어,
# 로컬/샌드박스의 SDK 다운로드 제약과 무관하게 .apk 산출물이 나온다.
# 완료되면 Actions 탭 → 해당 실행 → Artifacts 에서 app-debug.apk 다운로드.

on:
  push:
    paths:
      - "android/**"
      - "webapp/**"          # APK가 빌드 시 webapp/를 assets로 동기화하므로
      - ".github/workflows/android.yml"
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: altino-webctrl-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
