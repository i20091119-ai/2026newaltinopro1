name: Build Android APK

# GitHub 클라우드 러너에서 APK를 빌드한다.
# 러너에는 Android SDK가 미리 설치돼 있고 인터넷이 열려 있어,
# 로컬/샌드박스의 SDK 다운로드 제약과 무관하게 .apk 산출물이 나온다.
# 완료되면 Actions 탭 → 해당 실행 → Artifacts 에서 app-debug.apk 다운로드.

on:
  push:
    paths:
      - "android/**"
      - "webapp/**"          # APK가 빌드 시 webapp/를 assets로 동기화하므로
      - ".github/workflows/android.yml"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write        # 릴리스 생성(앱 안 업데이트가 여기서 apk 를 받아간다)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        # buildNumber: 실행번호를 versionCode 로 사용 → 기기에서 '업데이트'로 인식됨
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: altino-webctrl-apk-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 앱 안 '업데이트 확인' 버튼이 읽는 배포처.
      # 저장소가 공개라 태블릿은 로그인·토큰 없이 apk 를 받을 수 있다.
      # ⚠ 태그를 버전마다 새로 만든다(고정 태그면 URL이 같아 CDN이 옛 apk 를 캐시할 수 있음).
      - name: Publish GitHub Release
        if: github.ref_name == 'claude/tablet-webapp-altino-control-l1pngm'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="altino-v1.0.${RUN}.apk"
          cp "$SRC" "$OUT"
          NOTES=$(git log -1 --pretty=%B)
          gh release create "v1.0.${RUN}" "$OUT" \
            --title "알티노 태블릿 앱 v1.0.${RUN}" \
            --notes "$NOTES" \
            --latest
