<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>수학SW체험활동 — 모드 선택</title>
<style>
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-light.woff2') format('woff2');font-weight:300;font-display:swap;}
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-medium.woff2') format('woff2');font-weight:500;font-display:swap;}
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-bold.woff2') format('woff2');font-weight:700;font-display:swap;}
  :root{--cream:#fff7ea;--ink:#3a3230;--mut:#9b8f86;--mint:#37c9ad;--sun:#ffb23e;--coral:#ff7a86;--blue:#5ea0ff;--line:#f0e6d8;--shadow:0 10px 28px rgba(120,90,50,.14)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:'Esamanru','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;font-weight:500;color:var(--ink);
    background:linear-gradient(rgba(255,247,234,.45),rgba(255,247,234,.45)), url('assets/bg.png') center/cover no-repeat, var(--cream);
    height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;user-select:none}
  .brand{display:flex;align-items:center;gap:22px;margin-bottom:8px}
  .brand .mascot{width:210px;height:auto;filter:drop-shadow(0 10px 12px rgba(120,90,50,.22));transform-origin:50% 90%;animation:wobble 2.6s ease-in-out infinite}
  h1{font-weight:700;font-size:5rem;margin:0;line-height:1.05}
  .sub{color:var(--mut);font-size:1.45rem;margin:8px 0 34px;font-weight:300}
  /* 흔들흔들 애니메이션 */
  @keyframes wobble{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
  .cards .card{animation:wobble 3.4s ease-in-out infinite}
  .cards .card:nth-child(2){animation-duration:3.9s}
  .float{position:absolute;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(120,90,50,.18));opacity:.95;z-index:0}
  .float.f1{width:92px;top:7%;left:6%;animation:floaty 3.2s ease-in-out infinite}
  .float.f2{width:82px;top:10%;right:7%;animation:floaty 4.1s ease-in-out .4s infinite}
  .float.f3{width:78px;bottom:9%;left:7%;animation:floaty 3.7s ease-in-out .2s infinite}
  .float.f4{width:96px;bottom:8%;right:8%;animation:floaty 4.5s ease-in-out .6s infinite}
  .float.f5{width:70px;top:44%;left:3%;animation:floaty 3.4s ease-in-out .8s infinite}
  .float.f6{width:70px;top:40%;right:3%;animation:floaty 4.0s ease-in-out .1s infinite}
  .cards{position:relative;z-index:1}
  @media (prefers-reduced-motion:reduce){.brand .mascot,.cards .card,.float{animation:none}}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%;max-width:940px}
  .card{border:0;border-radius:28px;padding:32px 28px;text-align:left;cursor:pointer;color:#fff;box-shadow:var(--shadow);
    font-family:inherit;transition:transform .1s;min-height:280px;display:flex;flex-direction:column}
  .card:active{transform:translateY(3px)}
  .card .num{font-size:1.05rem;opacity:.9;font-weight:700}
  .card .ico{font-size:3.4rem;margin:6px 0 10px}
  .card h2{font-weight:700;font-size:1.9rem;margin:0 0 10px}
  .card p{font-weight:300;font-size:1.1rem;line-height:1.5;margin:0;opacity:.97;flex:1}
  .card .go{margin-top:14px;font-weight:700;font-size:1.15rem}
  .c1{background:linear-gradient(160deg,#5ea0ff,#37c9ad)}
  .c2{background:linear-gradient(160deg,#ff9db0,#ffb23e)}
  .foot{position:fixed;bottom:14px;right:18px}
  .foot a{color:var(--mut);font-size:.85rem;text-decoration:none;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
  <img class="float f1" src="assets/coin.png" alt="">
  <img class="float f2" src="assets/trophy.png" alt="">
  <img class="float f3" src="assets/speedup.png" alt="">
  <img class="float f4" src="assets/energy.png" alt="">
  <img class="float f5" src="assets/mascot-happy.png" alt="">
  <img class="float f6" src="assets/caught.png" alt="">

  <div class="brand">
    <img class="mascot" src="assets/mascot.png" alt="마스코트">
    <div><h1>수학SW체험활동</h1></div>
  </div>
  <p class="sub">무엇을 하고 놀까요? 🚗💨</p>

  <div class="cards">
    <button class="card c1" onclick="location.href='mode1.html'">
      <div class="num">① 코딩 미션</div>
      <div class="ico">🧩🤖</div>
      <h2>자율주행 코딩</h2>
      <p>수학 문제를 풀고 블록을 완성하면, 알티노가 <b>스스로</b> 코스를 달려요. (생각하는 도전!)</p>
      <div class="go">시작하기 →</div>
    </button>

    <button class="card c2" onclick="location.href='tag.html'">
      <div class="num">② 신나는 게임</div>
      <div class="ico">⚡🏁</div>
      <h2>수학 연료 꼬리잡기</h2>
      <p>문제를 풀어 <b>에너지</b>를 채우고 도망쳐라! 가장 적게 잡힌 사람이 승리! (직접 운전!)</p>
      <div class="go">시작하기 →</div>
    </button>
  </div>

  <div class="foot"><a href="index.html">조종 패널(개발용)</a></div>
</body>
</html>

<!-- pages deploy trigger -->
