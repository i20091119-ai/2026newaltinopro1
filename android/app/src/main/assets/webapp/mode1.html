<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>자율주행 코딩</title>
<style>
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-light.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-bold.woff2') format('woff2');font-weight:700;font-display:swap}
  :root{--cream:#fff7ea;--ink:#3a3230;--mut:#9b8f86;--mint:#37c9ad;--sun:#ffb23e;--coral:#ff7a86;--blue:#5ea0ff;--grape:#b085ff;--line:#f0e6d8;--card:#fff;--shadow:0 8px 24px rgba(120,90,50,.12);--r:22px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:'Esamanru','Pretendard',system-ui,sans-serif;font-weight:500;color:var(--ink);
    background:linear-gradient(rgba(255,247,234,.5),rgba(255,247,234,.5)), url('assets/bg.png') center/cover no-repeat, var(--cream);
    height:100vh;overflow:hidden;letter-spacing:.01em;user-select:none;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
  h1,.stat b{font-weight:700}
  .hidden{display:none !important}
  .btn{border:0;border-radius:16px;font-family:inherit;font-size:1.05rem;padding:12px 16px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:var(--shadow)}
  .btn:active{transform:translateY(2px)}.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
  .btn.mint{background:var(--mint)}.btn.sun{background:var(--sun);color:#5a3200}.btn.coral{background:var(--coral)}.btn:disabled{opacity:.45}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .topbar a{color:var(--blue);text-decoration:none;font-size:.95rem}
  .gradechip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:var(--shadow)}
  select{font-family:inherit;border:0;background:transparent;font-size:1rem;color:var(--coral);font-weight:700}
  .status{font-size:.85rem;color:var(--mut);background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px}
  .status.ok{color:#1b8f6a;border-color:#b9ecdc}.status.err{color:#c0392b;border-color:#f6c9c4}
  h1{font-size:1.5rem;margin:0}
  .lead{color:var(--mut);font-size:.95rem;margin:0}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
  .panel h2{font-size:1rem;color:var(--mut);margin:0 0 8px}
  #program{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
  .cap{color:var(--mut);font-size:.9rem}
  .pblock{display:flex;align-items:center;gap:6px;background:#eaf6ff;border:2px solid #d3e8ff;border-radius:14px;padding:8px 10px;font-size:1.05rem;cursor:pointer;position:relative}
  .pblock.left,.pblock.right{background:#f0e9ff;border-color:#ddd0ff}
  .pblock.back{background:#ffeef0;border-color:#ffd6dc}
  .pblock.run{outline:3px solid var(--sun);transform:scale(1.05)}
  .pblock .idx{background:#fff;border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--mut)}
  .pdel{border:0;background:transparent;color:#c0392b;font-size:.9rem;cursor:pointer;padding:0 2px}
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .palette button{font-family:inherit;font-size:1.15rem;padding:16px 8px;border:0;border-radius:16px;cursor:pointer;color:#fff;box-shadow:var(--shadow)}
  .pb-wall{background:var(--mint);font-weight:700}.pb-fwd{background:var(--blue)}.pb-left{background:var(--grape)}.pb-right{background:#7fb2ff}
  .pblock.wall{background:#e9fbf4;border-color:#bdeede}
  #loopBtn.on{background:var(--sun);color:#5a3200;border-color:var(--sun)}
  .rowbtns{display:flex;gap:8px;margin-top:10px}
  .side{display:flex;flex-direction:column;gap:10px;min-height:0}
  .runbig{font-size:1.5rem;padding:22px}
  details.cal{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow)}
  details.cal summary{cursor:pointer;color:var(--mut);font-size:.9rem}
  .cal label{font-size:.85rem;color:var(--mut);display:block;margin-top:6px}
  input[type=range]{width:100%;accent-color:var(--mint)}
  .modal{position:fixed;inset:0;background:rgba(60,40,20,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .sheet{background:#fff;border-radius:24px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(80,50,20,.3)}
  .sheet .q{font-size:2rem;margin:8px 0 14px}
  .sheet input{width:100%;font-size:1.6rem;text-align:center;padding:12px;border-radius:14px;border:3px solid #ffe0a3;font-family:inherit;background:#fffdf7}
  .sheet .row{display:flex;gap:10px;margin-top:12px}.sheet .fb{color:var(--coral);min-height:1.2em;margin-top:8px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--mint);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20;box-shadow:var(--shadow)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:720px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="topbar">
    <a href="home.html">← 홈</a>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="gradechip">학년 <select id="grade">
        <option value="e1">초1</option><option value="e2">초2</option><option value="e3" selected>초3</option>
        <option value="e4">초4</option><option value="e5">초5</option><option value="e6">초6</option>
        <option value="m1">중1</option><option value="m2">중2</option><option value="m3">중3</option>
      </select></span>
      <button id="connBtn" class="btn ghost" style="padding:6px 10px;font-size:.85rem">🔗 연결</button>
      <button id="btSettings" class="btn ghost" style="padding:6px 10px;font-size:.85rem">📶 설정</button>
      <span id="status" class="status">🔗 연결 안 됨</span>
    </div>
  </div>

  <div>
    <h1>🧩 자율주행 코딩</h1>
    <p class="lead">알티노가 <b>스스로 n자 코스</b>를 달리게 만들자! 「🧱벽까지 직진 → 회전」을 <b>🔁반복</b>으로 묶으면 벽을 감지하며 자율주행해요. 수학 문제를 풀어 출발!</p>
  </div>

  <div class="main">
    <div class="panel">
      <h2>내 프로그램 (순서대로 실행)</h2>
      <div id="program"></div>
      <div class="palette">
        <button class="pb-wall" data-block="wall" style="grid-column:1/3">🧱 벽까지 직진 (센서로 벽 감지)</button>
        <button class="pb-fwd" data-block="fwd">⬆️ 앞으로</button>
        <button class="pb-left" data-block="left">↰ 좌회전</button>
        <button class="pb-right" data-block="right">↱ 우회전</button>
      </div>
      <div class="rowbtns">
        <button id="loopBtn" class="btn ghost">🔁 반복: 꺼짐</button>
        <button id="undoBtn" class="btn ghost">↩️ 마지막</button>
        <button id="clearBtn" class="btn ghost">🗑️ 전체</button>
        <span class="cap" style="align-self:center">※ 앞으로 블록은 눌러 칸 수 변경</span>
      </div>
    </div>

    <div class="side">
      <button id="runBtn" class="btn mint runbig">▶ 출발 (문제 풀기)</button>
      <button id="stopBtn" class="btn coral runbig hidden">■ 정지</button>
      <details class="cal">
        <summary>🔧 주행 보정 (강사용) · 현재 앞센서(ir2): <b id="ir2now">–</b></summary>
        <label>벽 감지 거리 <b id="calWallV">130</b> (앞센서 ir2가 이보다 작으면 정지)</label>
        <input id="calWall" type="range" min="40" max="400" step="5" value="130">
        <label>90° 회전 시간 <b id="calTurnV">700</b> ms</label>
        <input id="calTurn" type="range" min="200" max="1500" step="50" value="700">
        <label>직진 속도 <b id="calSpeedV">320</b></label>
        <input id="calSpeed" type="range" min="150" max="700" step="10" value="320">
      </details>
      <p class="cap">처음이면 [📶 설정]에서 알티노를 페어링한 뒤 [🔗 연결]. 브라우저 데모는 벽 감지가 안 되니 흐름만 확인돼요(차는 안 움직임).</p>
    </div>
  </div>

  <div id="gateModal" class="modal hidden">
    <div class="sheet">
      <div class="cap">🔑 출발 암호 — 문제를 풀면 출발해요</div>
      <div class="q" id="gateQ">?</div>
      <input id="gateInput" type="number" inputmode="numeric" placeholder="정답은?">
      <div class="fb" id="gateFb"></div>
      <div class="row"><button id="gateOk" class="btn mint" style="flex:1">출발 🚗</button><button id="gateClose" class="btn ghost">닫기</button></div>
    </div>
  </div>
  <div id="toast"></div>

  <script src="js/protocol.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/code.js"></script>
</body>
</html>
