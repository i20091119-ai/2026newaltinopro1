<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>알티노 네오 컨트롤</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>알티노 네오 <span>웹 컨트롤</span></h1>
    <div id="status" class="status off">연결 안 됨</div>
  </header>

  <section class="conn">
    <div class="row">
      <label>브리지 WebSocket</label>
      <input id="wsurl" type="text" value="ws://localhost:8080" />
      <button id="c-ws" class="btn">브리지 연결</button>
    </div>
    <div class="row">
      <button id="c-serial" class="btn ghost">USB 시리얼</button>
      <select id="baud"><option>9600</option><option>38400</option><option>57600</option><option>115200</option></select>
      <button id="c-mock" class="btn ghost">데모(목)</button>
      <button id="c-disc" class="btn danger">연결 해제</button>
    </div>
  </section>

  <main>
    <div class="panel drive">
      <h2>주행</h2>
      <div class="dpad">
        <button id="btn-up"    class="pad up">▲</button>
        <button id="btn-left"  class="pad left">◀</button>
        <button id="btn-stop"  class="pad stop">■</button>
        <button id="btn-right" class="pad right">▶</button>
        <button id="btn-down"  class="pad down">▼</button>
      </div>
      <div class="slider">
        <label>속도 <b id="speedval">300</b></label>
        <input id="speed" type="range" min="0" max="1000" step="10" value="300" />
      </div>
      <div class="slider">
        <label>조향 <b id="steerval">0</b></label>
        <input id="steer" type="range" min="-127" max="127" step="1" value="0" />
      </div>
    </div>

    <div class="panel">
      <h2>LED / 부저</h2>
      <div class="btngrid">
        <button class="btn led" data-led="3">전조등</button>
        <button class="btn led" data-led="780">후미등</button>
        <button class="btn led" data-led="160">좌</button>
        <button class="btn led" data-led="80">우</button>
        <button class="btn led" data-led="15">전체</button>
      </div>
      <div class="btngrid">
        <button class="btn snd" data-sound="49">삐-</button>
        <button class="btn snd" data-sound="41">도</button>
        <button class="btn snd" data-sound="39">레</button>
        <button class="btn snd" data-sound="37">미</button>
      </div>
    </div>

    <div class="panel">
      <h2>도트매트릭스 8×8</h2>
      <div id="dotgrid" class="dotgrid"></div>
      <button id="dot-clear" class="btn ghost">지우기</button>
    </div>

    <div class="panel sensors">
      <h2>센서</h2>
      <div class="sgrid">
        <div class="s"><span>배터리</span><b id="sv-bat">–</b></div>
        <div class="s"><span>조도(CDS)</span><b id="sv-cds">–</b></div>
        <div class="s"><span>IR1</span><b id="sv-ir1">–</b></div>
        <div class="s"><span>IR2</span><b id="sv-ir2">–</b></div>
        <div class="s"><span>IR3</span><b id="sv-ir3">–</b></div>
        <div class="s"><span>IR4</span><b id="sv-ir4">–</b></div>
        <div class="s"><span>IR5</span><b id="sv-ir5">–</b></div>
        <div class="s"><span>IR6</span><b id="sv-ir6">–</b></div>
      </div>
    </div>
  </main>

  <footer>Bluetooth Classic SPP · 50ms 스트리밍 · <a href="../docs/PROTOCOL.md">프로토콜 명세</a> · <a href="protocol.test.html">셀프테스트</a></footer>

  <script src="js/protocol.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
